name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build documentation
        run: |
          swift package --allow-writing-to-directory ./site \
            generate-documentation \
            --target BrainzKit \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path BrainzKit \
            --output-path ./site
          echo '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=documentation/brainzkit/">' > ./site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
